<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SSTMS — Register</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="subtitle">Register as a student or teacher</p>

    <div class="role-toggle">
      <button id="roleStudentBtn" class="active" type="button">Student</button>
      <button id="roleTeacherBtn" type="button">Teacher</button>
    </div>

    <form id="registerForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" placeholder="e.g. Anjali Perera" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" required minlength="8">
      </div>

      <!-- Student-only fields -->
      <div id="studentFields">
        <div class="field">
          <label for="studentNo">Student ID</label>
          <input id="studentNo" type="text" placeholder="e.g. STU-2026-0142">
        </div>
        <div class="field">
          <label for="program">Program</label>
          <input id="program" type="text" placeholder="e.g. BSc Computer Science">
        </div>
      </div>

      <!-- Teacher-only fields -->
      <div id="teacherFields" class="hidden">
        <div class="field">
          <label for="qualification">Highest qualification</label>
          <input id="qualification" type="text" placeholder="e.g. MSc Software Engineering">
        </div>
        <div class="field">
          <label for="department">Department</label>
          <input id="department" type="text" placeholder="e.g. Faculty of Computing">
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin:-8px 0 16px;">
          Teacher accounts require Super Admin approval before login.
        </p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="app.js"></script>
<script>
  const studentBtn = document.getElementById('roleStudentBtn');
  const teacherBtn = document.getElementById('roleTeacherBtn');
  const studentFields = document.getElementById('studentFields');
  const teacherFields = document.getElementById('teacherFields');

  function setRole(role){
    const isStudent = role === 'student';
    studentBtn.classList.toggle('active', isStudent);
    teacherBtn.classList.toggle('active', !isStudent);
    studentFields.classList.toggle('hidden', !isStudent);
    teacherFields.classList.toggle('hidden', isStudent);
  }

  studentBtn.addEventListener('click', () => setRole('student'));
  teacherBtn.addEventListener('click', () => setRole('teacher'));

  // Pre-select role from ?role= query param coming from the landing page
  const params = new URLSearchParams(window.location.search);
  setRole(params.get('role') === 'teacher' ? 'teacher' : 'student');

  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const isStudent = studentBtn.classList.contains('active');
    // NOTE: replace with a real POST /api/v1/auth/register call to your Spring Boot backend.
    alert('Demo only — would POST to /api/v1/auth/register as ' + (isStudent ? 'STUDENT' : 'TEACHER'));
    go('login.html');
  });
</script>
</body>
</html>
