<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SSTMS — Welcome</title>
<link rel="stylesheet" href="index.css">
<style>
  
</style>
</head>
<body>
  <div class="landing">
    <span><span class="dot"></span>SSTMS</span>
    <h1>Smart Student–Teacher Management System</h1>
    <p class="lead">Choose how you'd like to continue</p>
    <div class="role-cards">
      <div class="role-card" onclick="go('register.html?role=student')">
        <div class="icon">🎓</div>
        <h3>I am a Student</h3>
        <p>Join classes, submit work, track grades and attendance.</p>
      </div>
      <div class="role-card" onclick="go('register.html?role=teacher')">
        <div class="icon">🧑‍🏫</div>
        <h3>I am a Teacher</h3>
        <p>Create classes, grade submissions, mark attendance.</p>
      </div>
    </div>
    <p class="landing-login">Already have an account? <a href="login.html">Log in</a></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
